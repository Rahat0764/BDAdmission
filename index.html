<!DOCTYPE html>
<html lang="bn" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a" id="theme-meta">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Admission">
    <title>ভর্তি পরীক্ষা কাউন্টডাউন</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #090f1a;
            --bg-app: #121b2b;
            --bg-header: #172439;
            --bg-card: #1a273c;
            --bg-card-hover: #21324c;
            --border-color: #293d5a;
            --border-active: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.15);
            --success: #10b981;
            --success-glow: rgba(16, 185, 129, 0.15);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --pattern-color: rgba(255, 255, 255, 0.03);
        }
        [data-theme="light"] {
            --bg-body: #e2e8f0;
            --bg-app: #ffffff;
            --bg-header: #f8fafc;
            --bg-card: #ffffff;
            --bg-card-hover: #f1f5f9;
            --border-color: #cbd5e1;
            --border-active: #2563eb;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent: #2563eb;
            --accent-glow: rgba(37, 99, 235, 0.1);
            --success: #059669;
            --success-glow: rgba(5, 150, 105, 0.1);
            --glass-bg: rgba(0, 0, 0, 0.02);
            --glass-border: rgba(0, 0, 0, 0.06);
            --pattern-color: rgba(0, 0, 0, 0.03);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Noto Sans Bengali', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            transition: background-color 0.4s ease;
            overflow: hidden;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .app-container {
            width: 100%;
            max-width: 440px;
            height: 100dvh;
            max-height: 860px;
            background-color: var(--bg-app);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        @media (min-width: 441px) {
            .app-container {
                border-radius: 30px;
                height: 95dvh;
                border: 1px solid var(--border-color);
            }
        }

        .bg-pattern {
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M20 15v10m-5-5h10' stroke='currentColor' stroke-width='1.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E");
            color: var(--pattern-color);
            pointer-events: none;
            z-index: 0;
        }

        .header-section {
            background-color: var(--bg-header);
            padding: 24px 20px 28px;
            border-bottom: 1px solid var(--border-color);
            position: relative;
            z-index: 1;
            transition: background-color 0.4s ease;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .dev-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            color: var(--text-muted);
            text-decoration: none;
            backdrop-filter: blur(8px);
            transition: transform 0.2s;
        }
        .dev-badge:active { transform: scale(0.95); }
        .dev-badge strong { color: var(--text-main); font-weight: 600; }

        .theme-toggle {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            backdrop-filter: blur(8px);
            font-family: inherit;
            transition: transform 0.2s, background 0.3s;
        }
        .theme-toggle:active { transform: scale(0.95); }
        
        .theme-icon { position: relative; width: 14px; height: 14px; }
        .theme-icon svg { position: absolute; inset: 0; width: 100%; height: 100%; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        [data-theme="dark"] .icon-sun { opacity: 0; transform: rotate(90deg) scale(0); }
        [data-theme="light"] .icon-moon { opacity: 0; transform: rotate(-90deg) scale(0); }

        .select-wrapper {
            position: relative;
            margin-bottom: 24px;
        }
        .custom-select {
            width: 100%;
            appearance: none;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            font-size: 16px;
            font-weight: 700;
            font-family: inherit;
            padding: 14px 44px 14px 18px;
            border-radius: 16px;
            outline: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .custom-select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-glow);
        }
        .select-icon {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
            transition: transform 0.3s ease;
        }
        .custom-select:focus + .select-icon { transform: translateY(-50%) rotate(180deg); color: var(--accent); }

        .countdown-display {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .unit-title-area { margin-bottom: 4px; }
        .unit-main-title {
            font-size: 24px;
            font-weight: 800;
            color: var(--text-main);
            line-height: 1.3;
            margin-bottom: 6px;
            animation: fadeIn 0.4s ease;
        }
        .unit-date-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
        }

        .badge-month-day {
            align-self: flex-start;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--glass-bg);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 12px;
        }
        .badge-month-day svg { color: var(--accent); }

        .time-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        .time-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px 8px;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }
        .time-box::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, var(--glass-border), transparent);
        }
        .time-val {
            font-family: 'JetBrains Mono', monospace;
            font-size: 28px;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1;
            display: block;
            margin-bottom: 6px;
        }
        .time-lbl {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .list-container {
            flex: 1;
            padding: 24px 20px;
            overflow-y: auto;
            position: relative;
            z-index: 1;
            scroll-behavior: smooth;
        }
        .list-container::-webkit-scrollbar { width: 0; background: transparent; }

        .list-header {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .unit-list { display: flex; flex-direction: column; gap: 12px; }

        .list-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .list-card::after {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0; width: 4px;
            background: var(--accent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .list-card:hover {
            border-color: var(--border-active);
            transform: translateY(-2px);
        }
        .list-card.active {
            background: var(--accent-glow);
            border-color: var(--accent);
        }
        .list-card.active::after { opacity: 1; }
        
        .card-info { display: flex; flex-direction: column; gap: 6px; }
        .card-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
            transition: color 0.3s ease;
        }
        .list-card.active .card-title { color: var(--accent); }
        .card-date {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-badge {
            font-size: 11px;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 20px;
            letter-spacing: 0.3px;
        }
        .status-upcoming {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 12px var(--accent-glow);
        }
        .status-done {
            background: var(--glass-bg);
            border: 1px solid var(--border-color);
            color: var(--success);
        }

        .finished-alert {
            background: var(--success-glow);
            border: 1px solid var(--success);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            animation: fadeIn 0.4s ease;
        }
        .finished-icon { font-size: 36px; margin-bottom: 12px; }
        .finished-text { font-size: 20px; font-weight: 800; color: var(--success); }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="bg-pattern"></div>
    
    <div class="header-section">
        <div class="top-bar">
            <a href="https://linkedin.com/in/RahatAhmedX" target="_blank" rel="noopener noreferrer" class="dev-badge">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><polyline points="16 11 18 13 22 9"/></svg>
                Developed by <strong>Rahat</strong>
            </a>
            <button class="theme-toggle" id="themeBtn">
                <div class="theme-icon">
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                </div>
                <span id="themeLabel">ডার্ক মোড</span>
            </button>
        </div>

        <div class="select-wrapper">
            <select class="custom-select" id="uniSelect"></select>
            <svg class="select-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </div>

        <div id="mainTimerArea"></div>
    </div>

    <div class="list-container">
        <div class="list-header">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
            সকল ইউনিট
        </div>
        <div class="unit-list" id="unitListArea"></div>
    </div>
</div>

<script>
const DB = {
    "DU": {
        name: "ঢাকা বিশ্ববিদ্যালয় (DU)",
        units: [
            { id: "iba", name: "IBA Unit", date: "2026-12-05T10:00:00" },
            { id: "a", name: "A Unit (বিজ্ঞান)", date: "2026-12-12T10:00:00" },
            { id: "b", name: "B Unit (কলা, আইন ও সামাজিক বিজ্ঞান)", date: "2026-12-19T10:00:00" },
            { id: "cha", name: "CHA Unit (চারুকলা)", date: "2026-12-22T10:00:00" },
            { id: "c", name: "C Unit (ব্যবসায় শিক্ষা)", date: "2026-12-26T10:00:00" }
        ]
    }
};

const engToBn = num => String(num).replace(/\d/g, d => "০১২৩৪৫৬৭৮৯"[d]);
const padZ = num => String(num).padStart(2, '0');

const formatFullDate = dStr => {
    const d = new Date(dStr);
    const date = d.toLocaleDateString('bn-BD', { day: 'numeric', month: 'long', year: 'numeric' });
    const day = d.toLocaleDateString('bn-BD', { weekday: 'long' });
    return `${date} • ${day}`;
};

const calcMonthsDays = (now, target) => {
    if (target < now) return { m: 0, d: 0 };
    let m = (target.getFullYear() - now.getFullYear()) * 12 + (target.getMonth() - now.getMonth());
    let d = target.getDate() - now.getDate();
    if (d < 0) {
        m -= 1;
        let prevMonth = new Date(target.getFullYear(), target.getMonth(), 0);
        d += prevMonth.getDate();
    }
    return { m, d };
};

let activeUni = localStorage.getItem('adm_uni') || 'DU';
if (!DB[activeUni]) activeUni = Object.keys(DB)[0];

let activeUnit = localStorage.getItem('adm_unit');
const validateUnit = () => {
    const list = DB[activeUni].units;
    if (!list.find(u => u.id === activeUnit)) activeUnit = list[0].id;
};
validateUnit();

const selectEl = document.getElementById('uniSelect');
const timerArea = document.getElementById('mainTimerArea');
const listArea = document.getElementById('unitListArea');

const initSelect = () => {
    selectEl.innerHTML = Object.entries(DB).map(([key, data]) => 
        `<option value="${key}" ${key === activeUni ? 'selected' : ''}>${data.name}</option>`
    ).join('');
};

const drawList = () => {
    const now = new Date();
    const units = DB[activeUni].units;
    
    listArea.innerHTML = units.map(u => {
        const isPast = new Date(u.date) < now;
        const activeCls = u.id === activeUnit ? 'active' : '';
        const badgeHTML = isPast 
            ? `<span class="status-badge status-done">সম্পন্ন</span>` 
            : `<span class="status-badge status-upcoming">আসন্ন</span>`;
            
        return `
            <div class="list-card ${activeCls}" data-id="${u.id}">
                <div class="card-info">
                    <span class="card-title">${u.name}</span>
                    <span class="card-date">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
                        ${formatFullDate(u.date)}
                    </span>
                </div>
                ${badgeHTML}
            </div>
        `;
    }).join('');

    document.querySelectorAll('.list-card').forEach(card => {
        card.addEventListener('click', (e) => {
            activeUnit = e.currentTarget.getAttribute('data-id');
            localStorage.setItem('adm_unit', activeUnit);
            drawList();
            tick(true);
        });
    });
};

const tick = (force = false) => {
    const unit = DB[activeUni].units.find(u => u.id === activeUnit);
    if (!unit) return;

    const now = new Date();
    const target = new Date(unit.date);
    const diff = target - now;

    if (diff < 0) {
        if (force || !timerArea.querySelector('.finished-alert')) {
            timerArea.innerHTML = `
                <div class="unit-title-area">
                    <div class="unit-main-title">${unit.name}</div>
                    <div class="unit-date-subtitle">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
                        ${formatFullDate(unit.date)}
                    </div>
                </div>
                <div class="finished-alert" style="margin-top:16px;">
                    <div class="finished-icon">🎉</div>
                    <div class="finished-text">পরীক্ষা সম্পন্ন হয়েছে!</div>
                </div>
            `;
        }
        return;
    }

    const { m, d } = calcMonthsDays(now, target);
    let mdStr = "";
    if (m > 0 && d > 0) mdStr = `${engToBn(m)} মাস ${engToBn(d)} দিন বাকি`;
    else if (m > 0) mdStr = `${engToBn(m)} মাস বাকি`;
    else if (d > 0) mdStr = `${engToBn(d)} দিন বাকি`;
    else mdStr = "আজকেই পরীক্ষা!";

    const days = Math.floor(diff / 86400000);
    const hrs = Math.floor((diff / 3600000) % 24);
    const mins = Math.floor((diff / 60000) % 60);
    const secs = Math.floor((diff / 1000) % 60);
    
    const vArr = [days, hrs, mins, secs];
    const lArr = ['দিন', 'ঘণ্টা', 'মিনিট', 'সেকেন্ড'];

    const existTitle = timerArea.querySelector('.unit-main-title');
    
    if (!force && existTitle && existTitle.textContent === unit.name) {
        const valNodes = timerArea.querySelectorAll('.time-val');
        vArr.forEach((v, i) => {
            const str = engToBn(padZ(v));
            if (valNodes[i] && valNodes[i].textContent !== str) valNodes[i].textContent = str;
        });
        const badgeNode = timerArea.querySelector('.badge-month-day span');
        if (badgeNode && badgeNode.textContent !== mdStr) badgeNode.textContent = mdStr;
    } else {
        const gridHTML = vArr.map((v, i) => `
            <div class="time-box">
                <span class="time-val">${engToBn(padZ(v))}</span>
                <span class="time-lbl">${lArr[i]}</span>
            </div>
        `).join('');

        timerArea.innerHTML = `
            <div class="countdown-display">
                <div class="unit-title-area">
                    <div class="unit-main-title">${unit.name}</div>
                    <div class="unit-date-subtitle">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
                        ${formatFullDate(unit.date)}
                    </div>
                </div>
                <div class="badge-month-day">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    <span>${mdStr}</span>
                </div>
                <div class="time-grid">${gridHTML}</div>
            </div>
        `;
    }
};

selectEl.addEventListener('change', e => {
    activeUni = e.target.value;
    localStorage.setItem('adm_uni', activeUni);
    validateUnit();
    localStorage.setItem('adm_unit', activeUnit);
    drawList();
    tick(true);
});

const themeBtn = document.getElementById('themeBtn');
const lbl = document.getElementById('themeLabel');
const meta = document.getElementById('theme-meta');
const html = document.documentElement;

const applyTheme = t => {
    html.setAttribute('data-theme', t);
    lbl.textContent = t === 'dark' ? 'ডার্ক মোড' : 'লাইট মোড';
    meta.setAttribute('content', t === 'dark' ? '#172439' : '#f8fafc');
};

let currentTheme = localStorage.getItem('adm_theme') || 'dark';
applyTheme(currentTheme);

themeBtn.addEventListener('click', () => {
    currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
    localStorage.setItem('adm_theme', currentTheme);
    applyTheme(currentTheme);
});

initSelect();
drawList();
tick(true);
setInterval(() => tick(false), 1000);
</script>
</body>
</html>
